<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloverky.cloud</title>
<meta name="description" content="cloverky가 만드는 AI 프로덕트 모음.">
<meta property="og:title" content="cloverky.cloud">
<meta property="og:type" content="website">
<meta property="og:url" content="https://cloverky.cloud/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='%23226647'><circle cx='16' cy='8' r='6.4'/><circle cx='24' cy='16' r='6.4'/><circle cx='16' cy='24' r='6.4'/><circle cx='8' cy='16' r='6.4'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --paper:#F4F6FA;
  --raised:#FFFFFF;
  --ink:#12161D;
  --soft:#5A6478;
  --rule:#D8DCE6;
  --clover:#226647;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans KR","IBM Plex Sans",system-ui,sans-serif;
  --shadow:0 2px 8px rgba(18,22,29,.08),0 1px 2px rgba(18,22,29,.06);
  --shadow-md:0 4px 20px rgba(18,22,29,.12),0 1px 3px rgba(18,22,29,.08);
}
@media(prefers-color-scheme:dark){
  :root{
    --paper:#0E1218;
    --raised:#161C25;
    --ink:#E7ECF3;
    --soft:#8590A3;
    --rule:#252E3B;
    --clover:#5ED39B;
    --shadow:0 2px 8px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 4px 20px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.4);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100dvh;
}
:focus-visible{outline:2px solid var(--clover);outline-offset:3px;border-radius:3px}

/* main center block */
.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex:1;
  width:100%;
  max-width:700px;
  padding:0 24px;
  gap:0;
  transition:justify-content .3s ease;
}
.center.has-chat{
  justify-content:flex-end;
  padding-bottom:32px;
}

/* logo */
.logo{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:36px;
  transition:margin .3s ease, opacity .3s ease;
  user-select:none;
  cursor:default;
}
/* logo slides to top-left on first chat — handled via JS inline styles */
.logo-mark{width:44px;height:44px;color:var(--clover)}
.logo-text{
  font-family:var(--mono);
  font-size:clamp(1.6rem,5vw,2.6rem);
  font-weight:600;
  letter-spacing:-.03em;
  color:var(--ink);
}
.logo-text .tld{color:var(--clover)}

/* messages */
.messages{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
  max-height:55vh;
  overflow-y:auto;
  padding-bottom:20px;
  scroll-behavior:smooth;
}
.msg{
  display:flex;
  gap:10px;
  max-width:90%;
  animation:pop .2s ease both;
}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{
  width:26px;height:26px;border-radius:50%;
  background:var(--clover);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:600;
  flex:none;margin-top:2px;
}
.msg.user .msg-avatar{background:var(--rule);color:var(--soft)}
.msg-bubble{
  padding:9px 13px;border-radius:14px;
  font-size:14px;line-height:1.6;word-break:keep-all;
}
.msg.bot .msg-bubble{
  background:var(--raised);border:1px solid var(--rule);
  border-bottom-left-radius:4px;
  box-shadow:var(--shadow);
}
.msg.user .msg-bubble{
  background:var(--clover);color:#fff;
  border-bottom-right-radius:4px;
}
.msg-bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}

/* typing */
.typing .msg-bubble{display:flex;gap:4px;align-items:center;padding:12px 14px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--soft);animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}

/* input area */
.input-wrap{width:100%;margin-top:20px}
.input-box{
  display:flex;align-items:center;gap:0;
  background:var(--raised);
  border:1.5px solid var(--rule);
  border-radius:28px;
  padding:6px 6px 6px 22px;
  box-shadow:var(--shadow-md);
  transition:border-color .15s, box-shadow .15s;
}
.input-box:focus-within{
  border-color:var(--clover);
  box-shadow:0 4px 24px rgba(34,102,71,.12),0 1px 3px rgba(34,102,71,.08);
}
.chat-input{
  flex:1;border:none;background:transparent;
  font:inherit;font-size:15px;color:var(--ink);
  outline:none;padding:6px 0;
}
.chat-input::placeholder{color:var(--soft)}
.send-btn{
  width:42px;height:42px;border-radius:50%;
  background:var(--clover);border:none;
  color:#fff;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .15s,transform .1s;
}
.send-btn:hover{opacity:.88}
.send-btn:active{transform:scale(.93)}

/* chips */
.chips{
  display:flex;flex-wrap:wrap;gap:6px;
  justify-content:center;
  margin-top:14px;
}
.chip{
  font-family:var(--mono);font-size:11px;
  padding:5px 12px;border-radius:20px;
  background:var(--raised);border:1px solid var(--rule);
  color:var(--soft);cursor:pointer;
  box-shadow:var(--shadow);
  transition:border-color .15s,color .15s;
}
.chip:hover{border-color:var(--clover);color:var(--clover)}

/* projects */
.projects{
  display:flex;gap:14px;
  justify-content:center;
  flex-wrap:nowrap;
  margin-top:36px;
  padding-bottom:40px;
  width:100%;
  max-width:700px;
  transition:margin .3s ease;
}
.center.has-chat .projects{margin-top:24px}
.proj{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  text-decoration:none;color:inherit;
  width:148px;
}
.proj-card{
  width:148px;height:96px;border-radius:14px;
  border:1px solid var(--rule);
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex;flex-direction:column;
  transition:transform .18s,box-shadow .18s;
  background:var(--raised);
}
.proj:hover .proj-card{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.proj-bar{
  height:20px;background:var(--paper);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;padding:0 8px;gap:4px;flex:none;
}
.proj-dot{width:5px;height:5px;border-radius:50%;background:var(--rule)}
.proj-url{
  font-family:var(--mono);font-size:8px;color:var(--soft);
  margin-left:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.proj-thumb{
  flex:1;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.9);
}
.proj-thumb svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.15))}
.proj-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.proj-name{
  font-family:var(--mono);font-size:11px;font-weight:500;
  color:var(--soft);text-align:center;letter-spacing:.01em;
}

/* per-project colors */
.thumb-arda  { background:linear-gradient(135deg,#4F6BED 0%,#7B8FFF 100%) }
.thumb-fridge{ background:linear-gradient(135deg,#226647 0%,#4CAF7D 100%) }
.thumb-yaksok{ background:linear-gradient(135deg,#2B9E8E 0%,#5EC9B8 100%) }
.thumb-yang  { background:linear-gradient(135deg,#D97706 0%,#F59E42 100%) }

@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}}
@media(max-width:600px){
  .center{padding:0 16px}
  .logo-text{font-size:1.5rem}
  .projects{gap:8px;overflow-x:auto;justify-content:flex-start;padding-bottom:48px}
  .proj{width:120px;flex:none}
  .proj-card{width:120px;height:80px}
}
</style>
</head>
<body>

<div class="center" id="center">

  <div class="logo" id="logo">
    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><circle cx="16" cy="8" r="6.4"/><circle cx="24" cy="16" r="6.4"/><circle cx="16" cy="24" r="6.4"/><circle cx="8" cy="16" r="6.4"/></g></svg>
    <span class="logo-text">cloverky<span class="tld">.cloud</span></span>
  </div>

  <div class="messages" id="messages" aria-live="polite"></div>

  <div class="input-wrap">
    <form class="input-box" id="form" autocomplete="off">
      <input class="chat-input" id="input" type="text" placeholder="cloverky에 대해 물어보세요…" aria-label="질문 입력">
      <button class="send-btn" type="submit" aria-label="전송">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </form>
    <div class="chips" id="chips">
      <button class="chip" data-q="어떤 프로젝트 있어?">프로젝트</button>
      <button class="chip" data-q="기술 스택이 뭐야?">기술 스택</button>
      <button class="chip" data-q="연락처 알려줘">연락처</button>
      <button class="chip" data-q="cloverky가 누구야?">소개</button>
    </div>
  </div>

  <nav class="projects" aria-label="프로젝트">
    <a class="proj" href="https://arda.cloverky.cloud">
      <div class="proj-card">
        <div class="proj-bar">
          <div class="proj-dot"></div><div class="proj-dot"></div><div class="proj-dot"></div>
          <span class="proj-url">arda.cloverky.cloud</span>
        </div>
        <div class="proj-thumb thumb-arda">
          <img src="assets/arda.webp" alt="Arda">
        </div>
      </div>
      <span class="proj-name">Arda</span>
    </a>
    <a class="proj" href="https://fridge.cloverky.cloud">
      <div class="proj-card">
        <div class="proj-bar">
          <div class="proj-dot"></div><div class="proj-dot"></div><div class="proj-dot"></div>
          <span class="proj-url">fridge.cloverky.cloud</span>
        </div>
        <div class="proj-thumb thumb-fridge">
          <img src="assets/fridge.png" alt="FridgeAI">
        </div>
      </div>
      <span class="proj-name">FridgeAI</span>
    </a>
    <a class="proj" href="https://yaksok.cloverky.cloud">
      <div class="proj-card">
        <div class="proj-bar">
          <div class="proj-dot"></div><div class="proj-dot"></div><div class="proj-dot"></div>
          <span class="proj-url">yaksok.cloverky.cloud</span>
        </div>
        <div class="proj-thumb thumb-yaksok">
          <img src="assets/yaksok.png" alt="Yaksok">
        </div>
      </div>
      <span class="proj-name">Yaksok</span>
    </a>
    <a class="proj" href="https://yangdongi.cloverky.cloud">
      <div class="proj-card">
        <div class="proj-bar">
          <div class="proj-dot"></div><div class="proj-dot"></div><div class="proj-dot"></div>
          <span class="proj-url">yangdongi.cloverky.cloud</span>
        </div>
        <div class="proj-thumb thumb-yang">
          <img src="assets/yangdongi.png" alt="Yangdongi">
        </div>
      </div>
      <span class="proj-name">Yangdongi</span>
    </a>
  </nav>

</div>

<script>
const FAQ=[
  {keys:['누구','소개','who','cloverky가','cloverky는','이 사이트'],answer:'안녕하세요! 저는 **cloverky** — Team.Seuk의 개발자입니다. AI 프로덕트를 만들고 있고, 이 도메인에서 제가 만든 서비스들을 운영하고 있어요.'},
  {keys:['프로젝트','만든','서비스','뭐 있','어떤'],answer:'현재 4개의 프로젝트가 있어요:\n\n• **Arda** — AI 채용 지원 관리 시스템\n• **FridgeAI** — AI 냉장고 재고·레시피 관리\n• **Yaksok** — 알약 식별 AI 서비스\n• **Yangdongi** — 동양미래대 학사 정보 AI 챗봇\n\n아래 아이콘을 눌러 바로 방문해보세요!'},
  {keys:['arda','채용','ats','지원자','칸반'],answer:'**Arda**는 AI 기반 채용 지원 관리 시스템(ATS)이에요.\n지원자 칸반 보드로 채용 단계를 관리하고, 단계 이동 시 지원자에게 메일을 자동 발송합니다.\n스택: React · FastAPI · PostgreSQL · AWS\n👉 <a href="https://arda.cloverky.cloud" target="_blank">arda.cloverky.cloud</a>'},
  {keys:['fridge','냉장고','재고','레시피','fridgeai'],answer:'**FridgeAI**는 AI가 냉장고 재고를 챙기고 취향에 맞는 레시피를 추천해주는 서비스예요.\n스택: Next.js · Vercel\n👉 <a href="https://fridge.cloverky.cloud" target="_blank">fridge.cloverky.cloud</a>'},
  {keys:['yaksok','약속','알약','약','식약처','복약'],answer:'**Yaksok**은 알약을 카메라로 비추면 모양·색·각인을 읽어 식약처 낱알식별 DB와 대조하고 복약 상담까지 안내하는 서비스예요.\n스택: React · FastAPI · Gemini Vision\n👉 <a href="https://yaksok.cloverky.cloud" target="_blank">yaksok.cloverky.cloud</a>'},
  {keys:['yangdongi','양동이','동양미래','학사','학점','시간표','챗봇'],answer:'**Yangdongi**는 동양미래대학교 학사 정보를 자연어로 물어보면 공지·시간표·학점을 찾아 정리해주는 AI 챗봇이에요.\n스택: Flask · FastAPI · RAG\n👉 <a href="https://yangdongi.cloverky.cloud" target="_blank">yangdongi.cloverky.cloud</a>'},
  {keys:['스택','기술','언어','tech','framework'],answer:'주로 사용하는 기술 스택이에요:\n\n**Frontend** — React, Next.js, TypeScript\n**Backend** — FastAPI, Flask, Python\n**AI/ML** — Gemini Vision, RAG, QLoRA\n**Infra** — AWS, Vercel, Docker, PostgreSQL'},
  {keys:['연락','이메일','contact','email','메일'],answer:'📧 <a href="mailto:hisoyeon04@gmail.com">hisoyeon04@gmail.com</a>\n🐙 <a href="https://github.com/cloverky" target="_blank">github.com/cloverky</a>'},
  {keys:['github','깃허브','코드','레포'],answer:'🐙 <a href="https://github.com/cloverky" target="_blank">github.com/cloverky</a>'},
  {keys:['안녕','하이','hi','hello','헬로','반가','ㅎㅇ'],answer:'안녕하세요! 👋 cloverky.cloud에 오신 걸 환영해요. 궁금한 거 편하게 물어보세요!'}
];

function renderMd(t){
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>')
    .replace(/&lt;(a [^&]+)&gt;(.+?)&lt;\/a&gt;/g,'<$1>$2</a>');
}

function addMsg(text,role){
  const el=document.createElement('div');
  el.className=`msg ${role}`;
  const av=document.createElement('div');
  av.className='msg-avatar';
  av.textContent=role==='bot'?'C':'me';
  const bub=document.createElement('div');
  bub.className='msg-bubble';
  if(role==='bot') bub.innerHTML=renderMd(text);
  else bub.textContent=text;
  el.appendChild(av);el.appendChild(bub);
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'end'});
  return el;
}

function showTyping(){
  const el=document.createElement('div');
  el.className='msg bot typing';
  el.innerHTML='<div class="msg-avatar">C</div><div class="msg-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'end'});
  return el;
}

function getAnswer(q){
  const l=q.toLowerCase();
  for(const item of FAQ){
    if(item.keys.some(k=>l.includes(k))) return item.answer;
  }
  return '음… 잘 모르겠어요. 📧 <a href="mailto:hisoyeon04@gmail.com">hisoyeon04@gmail.com</a>으로 직접 물어봐 주세요!';
}

let logoMoved=false;
function animateLogo(){
  if(logoMoved) return;
  logoMoved=true;
  const logo=document.getElementById('logo');
  const r=logo.getBoundingClientRect();
  // snap to fixed at current position (no transition yet)
  logo.style.cssText=`position:fixed;top:${r.top}px;left:${r.left}px;width:${r.width}px;margin:0;z-index:50;transform-origin:top left;cursor:pointer`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    logo.style.transition='top .45s cubic-bezier(.4,0,.2,1),left .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1)';
    logo.style.top='16px';
    logo.style.left='20px';
    logo.style.transform='scale(0.58)';
  }));
}

function send(q){
  if(!q.trim()) return;
  document.getElementById('input').value='';
  animateLogo();
  document.getElementById('center').classList.add('has-chat');
  addMsg(q,'user');
  const t=showTyping();
  setTimeout(()=>{t.remove();addMsg(getAnswer(q),'bot');},500+Math.random()*300);
}

document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();send(document.getElementById('input').value);});
document.getElementById('logo').addEventListener('click',()=>{
  if(!logoMoved) return;
  logoMoved=false;
  const logo=document.getElementById('logo');
  logo.style.transition='opacity .25s';
  logo.style.opacity='0';
  setTimeout(()=>{
    logo.style.cssText='';
    document.getElementById('center').classList.remove('has-chat');
    document.getElementById('messages').innerHTML='';
    requestAnimationFrame(()=>{logo.style.transition='opacity .3s';logo.style.opacity='1';});
  },260);
});
document.getElementById('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)send(c.dataset.q);});
</script>
</body>
</html>
