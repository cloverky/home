<style>
:root{
  color-scheme:light dark;
  --paper:#F4F6FA;
  --raised:#FFFFFF;
  --ink:#12161D;
  --soft:#5A6478;
  --rule:#D8DCE6;
  --clover:#226647;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans KR","IBM Plex Sans",system-ui,sans-serif;
  --shadow:0 2px 8px rgba(18,22,29,.08),0 1px 2px rgba(18,22,29,.06);
  --shadow-md:0 4px 20px rgba(18,22,29,.12),0 1px 3px rgba(18,22,29,.08);
}
@media(prefers-color-scheme:dark){
  :root{
    --paper:#0E1218;
    --raised:#161C25;
    --ink:#E7ECF3;
    --soft:#8590A3;
    --rule:#252E3B;
    --clover:#5ED39B;
    --shadow:0 2px 8px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 4px 20px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.4);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100dvh;
}
:focus-visible{outline:2px solid var(--clover);outline-offset:3px;border-radius:3px}

/* main center block */
.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex:1;
  width:100%;
  max-width:700px;
  padding:0 24px;
  gap:0;
  transition:justify-content .3s ease;
}
.center.has-chat{
  justify-content:flex-end;
  padding-bottom:32px;
}

/* logo */
.logo{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:36px;
  transition:margin .3s ease, opacity .3s ease;
  user-select:none;
  cursor:default;
}
/* logo slides to top-left on first chat — handled via JS inline styles */
.logo-mark{width:54px;height:54px;color:var(--clover)}
.logo-text{
  font-family:var(--mono);
  font-size:clamp(1.6rem,6vw,3.2rem);
  font-weight:600;
  letter-spacing:-.03em;
  color:var(--ink);
}
.logo-text .tld{color:var(--clover)}

/* messages */
.messages{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
  max-height:55vh;
  overflow-y:auto;
  padding-bottom:20px;
  scroll-behavior:smooth;
}
.msg{
  display:flex;
  gap:10px;
  max-width:90%;
  animation:pop .2s ease both;
}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{
  width:26px;height:26px;border-radius:50%;
  background:var(--clover);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:600;
  flex:none;margin-top:2px;
}
.msg.user .msg-avatar{background:var(--rule);color:var(--soft)}
.msg-bubble{
  padding:9px 13px;border-radius:14px;
  font-size:14px;line-height:1.6;word-break:keep-all;
}
.msg.bot .msg-bubble{
  background:var(--raised);border:1px solid var(--rule);
  border-bottom-left-radius:4px;
  box-shadow:var(--shadow);
}
.msg.user .msg-bubble{
  background:var(--clover);color:#fff;
  border-bottom-right-radius:4px;
}
.msg-bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}

/* typing */
.typing .msg-bubble{display:flex;gap:4px;align-items:center;padding:12px 14px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--soft);animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}

/* input area */
.input-wrap{width:100%;margin-top:20px}
.input-box{
  display:flex;align-items:center;gap:0;
  background:var(--raised);
  border:1.5px solid var(--rule);
  border-radius:28px;
  padding:6px 6px 6px 22px;
  box-shadow:var(--shadow-md);
  transition:border-color .15s, box-shadow .15s;
}
.input-box:focus-within{
  border-color:var(--clover);
  box-shadow:0 4px 24px rgba(34,102,71,.12),0 1px 3px rgba(34,102,71,.08);
}
.chat-input{
  flex:1;border:none;background:transparent;
  font:inherit;font-size:15px;color:var(--ink);
  outline:none;padding:6px 0;
}
.chat-input::placeholder{color:var(--soft)}
.send-btn{
  width:42px;height:42px;border-radius:50%;
  background:var(--clover);border:none;
  color:#fff;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .15s,transform .1s;
}
.send-btn:hover{opacity:.88}
.send-btn:active{transform:scale(.93)}

/* chips */
.chips{
  display:flex;flex-wrap:wrap;gap:6px;
  justify-content:center;
  margin-top:14px;
}
.chip{
  font-family:var(--mono);font-size:11px;
  padding:5px 12px;border-radius:20px;
  background:var(--raised);border:1px solid var(--rule);
  color:var(--soft);cursor:pointer;
  box-shadow:var(--shadow);
  transition:border-color .15s,color .15s;
}
.chip:hover{border-color:var(--clover);color:var(--clover)}

/* projects */
.projects{
  display:flex;gap:14px;
  justify-content:center;
  flex-wrap:nowrap;
  margin-top:36px;
  padding-bottom:40px;
  width:100%;
  max-width:810px;
  transition:margin .3s ease;
}
.center.has-chat .projects{margin-top:24px}
.proj{
  display:flex;flex-direction:column;align-items:flex-start;
  position:relative;
  width:190px;
}
.proj-card{
  position:relative;z-index:1;pointer-events:none;
  width:190px;height:127px;border-radius:12px;
  border:1px solid var(--rule);
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:transform .18s,box-shadow .18s;
  background:var(--raised);
}
.proj:hover .proj-card{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.proj-thumb{position:absolute;inset:0}
.proj-thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
/* 밝은 스크린샷 위에서도 읽히도록 반투명 어두운 알약 */
.proj-badge{
  position:absolute;top:8px;left:8px;
  padding:3px 8px;border-radius:999px;
  font-size:10.5px;font-weight:600;color:#fff;
  background:rgba(18,22,29,.62);
  white-space:nowrap;
}
.proj-name{
  margin-top:10px;
  font-size:14px;font-weight:600;color:var(--ink);
  text-decoration:none;
}
.proj-desc{
  margin-top:2px;font-size:12px;color:var(--soft);
  line-height:1.4;word-break:keep-all;
}
/* 이름 링크가 카드 전체를 덮고, 문서 아이콘만 그 위로 올라온다 (a 안에 a를 못 넣어서) */
.proj-name::after{content:"";position:absolute;inset:0}
.proj-docs{
  pointer-events:auto;
  position:absolute;top:6px;right:6px;
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--clover);background:rgba(255,255,255,.92);
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.proj-docs:hover{background:#fff}

/* per-project colors */
.thumb-arda  { background:linear-gradient(135deg,#4F6BED 0%,#7B8FFF 100%) }
.thumb-fridge{ background:linear-gradient(135deg,#226647 0%,#4CAF7D 100%) }
.thumb-yaksok{ background:linear-gradient(135deg,#2B9E8E 0%,#5EC9B8 100%) }
.thumb-yang  { background:#f0f2f5 }
/* 가로로 긴 화면이라 잘리지 않게 통째로 넣고, 남는 위아래는 스크린샷 바탕색으로 채운다 */
.thumb-yang img{object-fit:contain;object-position:center}

@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}}
@media(max-width:600px){
  .center{padding:0 16px}
  .logo-text{font-size:1.5rem}
  .projects{gap:8px;overflow-x:auto;justify-content:flex-start;padding-bottom:48px}
  .proj{width:150px;flex:none}
  .proj-card{width:150px;height:100px}
}
</style>
</head>

  {keys:['arda','아르다','채용','ats','지원자','칸반'],answer:'**Arda**는 AI 기반 채용 지원 관리 시스템(ATS)이에요.\n지원자 칸반 보드로 채용 단계를 관리하고, 단계 이동 시 지원자에게 메일을 자동 발송합니다.\n스택: React · FastAPI · PostgreSQL · AWS\n👉 <a href="https://arda.cloverky.cloud" target="_blank">arda.cloverky.cloud</a>'},

  {keys:['yaksok','약속','알약','식약처','복약'],answer:'**Yaksok**은 알약을 카메라로 비추면 모양·색·각인을 읽어 식약처 낱알식별 DB와 대조하고 복약 상담까지 안내하는 서비스예요.\n스택: React · FastAPI · Gemini Vision\n👉 <a href="https://yaksok.cloverky.cloud" target="_blank">yaksok.cloverky.cloud</a>'},

function renderMd(t){
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>')
    .replace(/&lt;(a [^&]+)&gt;(.+?)&lt;\/a&gt;/g,'<$1>$2</a>');
}

function addMsg(text,role){
  const el=document.createElement('div');
  el.className=`msg ${role}`;
  const av=document.createElement('div');
  av.className='msg-avatar';
  av.textContent=role==='bot'?'C':'me';
  const bub=document.createElement('div');
  bub.className='msg-bubble';
  if(role==='bot') bub.innerHTML=renderMd(text);
  else bub.textContent=text;
  el.appendChild(av);el.appendChild(bub);
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'end'});
  return el;
}

function showTyping(){
  const el=document.createElement('div');
  el.className='msg bot typing';
  el.innerHTML='<div class="msg-avatar">C</div><div class="msg-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'end'});
  return el;
}

function getAnswer(q){
  const l=q.toLowerCase();
  for(const item of FAQ){
    if(item.keys.some(k=>l.includes(k))) return item.answer;
  }
  return '음… 그건 아직 대답하기 어려워요.\n**소개 · 학력 · 프로젝트 · 기술 스택 · 경력 · 강점 · 연락처** 중에서 물어봐 주세요!\n더 궁금한 건 📧 <a href="mailto:Soyeon040403@gmail.com">Soyeon040403@gmail.com</a>으로 보내 주세요.';
}

let logoMoved=false;
function animateLogo(){
  if(logoMoved) return;
  logoMoved=true;
  const logo=document.getElementById('logo');
  const r=logo.getBoundingClientRect();
  // snap to fixed at current position (no transition yet)
  logo.style.cssText=`position:fixed;top:${r.top}px;left:${r.left}px;width:${r.width}px;margin:0;z-index:50;transform-origin:top left;cursor:pointer`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    logo.style.transition='top .45s cubic-bezier(.4,0,.2,1),left .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1)';
    logo.style.top='16px';
    logo.style.left='20px';
    logo.style.transform='scale(0.45)';
  }));
}

function send(q){
  if(!q.trim()) return;
  document.getElementById('input').value='';
  animateLogo();
  document.getElementById('center').classList.add('has-chat');
  addMsg(q,'user');
  const t=showTyping();
  setTimeout(()=>{t.remove();addMsg(getAnswer(q),'bot');},500+Math.random()*300);
}

document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();send(document.getElementById('input').value);});
document.getElementById('logo').addEventListener('click',()=>{
  if(!logoMoved) return;
  logoMoved=false;
  const logo=document.getElementById('logo');
  logo.style.transition='opacity .25s';
  logo.style.opacity='0';
  setTimeout(()=>{
    logo.style.cssText='';
    document.getElementById('center').classList.remove('has-chat');
    document.getElementById('messages').innerHTML='';
    requestAnimationFrame(()=>{logo.style.transition='opacity .3s';logo.style.opacity='1';});
  },260);
});
document.getElementById('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)send(c.dataset.q);});
</script>
