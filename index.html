<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cloverky.cloud</title>
<meta name="description" content="cloverky가 만드는 AI 프로덕트 모음.">
<meta property="og:title" content="cloverky.cloud">
<meta property="og:type" content="website">
<meta property="og:url" content="https://cloverky.cloud/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g fill='%23226647'><circle cx='16' cy='8' r='6.4'/><circle cx='24' cy='16' r='6.4'/><circle cx='16' cy='24' r='6.4'/><circle cx='8' cy='16' r='6.4'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --paper:#F4F6FA;
  --raised:#FFFFFF;
  --ink:#12161D;
  --soft:#5A6478;
  --rule:#D8DCE6;
  --clover:#226647;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans KR","IBM Plex Sans",system-ui,sans-serif;
  --shadow:0 2px 8px rgba(18,22,29,.08),0 1px 2px rgba(18,22,29,.06);
  --shadow-md:0 4px 20px rgba(18,22,29,.12),0 1px 3px rgba(18,22,29,.08);
}
@media(prefers-color-scheme:dark){
  :root{
    --paper:#0E1218;
    --raised:#161C25;
    --ink:#E7ECF3;
    --soft:#8590A3;
    --rule:#252E3B;
    --clover:#5ED39B;
    --shadow:0 2px 8px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    --shadow-md:0 4px 20px rgba(0,0,0,.6),0 1px 3px rgba(0,0,0,.4);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100dvh;
}
:focus-visible{outline:2px solid var(--clover);outline-offset:3px;border-radius:3px}

/* main center block */
.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex:1;
  width:100%;
  max-width:700px;
  padding:0 24px;
  gap:0;
  transition:justify-content .3s ease;
}
.center.has-chat{
  justify-content:flex-end;
  padding-bottom:32px;
}

/* logo */
.logo{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:36px;
  transition:margin .3s ease, opacity .3s ease;
  user-select:none;
  cursor:default;
}
/* logo slides to top-left on first chat — handled via JS inline styles */
.logo-mark{width:54px;height:54px;color:var(--clover)}
.logo-text{
  font-family:var(--mono);
  font-size:clamp(1.6rem,6vw,3.2rem);
  font-weight:600;
  letter-spacing:-.03em;
  color:var(--ink);
}
.logo-text .tld{color:var(--clover)}

/* messages */
.messages{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
  max-height:55vh;
  overflow-y:auto;
  padding-bottom:20px;
  scroll-behavior:smooth;
}
.msg{
  display:flex;
  gap:10px;
  max-width:90%;
  animation:pop .2s ease both;
}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{
  width:26px;height:26px;border-radius:50%;
  background:var(--clover);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:600;
  flex:none;margin-top:2px;
}
.msg.user .msg-avatar{background:var(--rule);color:var(--soft)}
.msg-bubble{
  padding:9px 13px;border-radius:14px;
  font-size:14px;line-height:1.6;word-break:keep-all;
}
.msg.bot .msg-bubble{
  background:var(--raised);border:1px solid var(--rule);
  border-bottom-left-radius:4px;
  box-shadow:var(--shadow);
}
.msg.user .msg-bubble{
  background:var(--clover);color:#fff;
  border-bottom-right-radius:4px;
}
.msg-bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}

/* typing */
.typing .msg-bubble{display:flex;gap:4px;align-items:center;padding:12px 14px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--soft);animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}

/* input area */
.input-wrap{width:100%;margin-top:20px}
.input-box{
  display:flex;align-items:center;gap:0;
  background:var(--raised);
  border:1.5px solid var(--rule);
  border-radius:28px;
  padding:6px 6px 6px 22px;
  box-shadow:var(--shadow-md);
  transition:border-color .15s, box-shadow .15s;
}
.input-box:focus-within{
  border-color:var(--clover);
  box-shadow:0 4px 24px rgba(34,102,71,.12),0 1px 3px rgba(34,102,71,.08);
}
.chat-input{
  flex:1;border:none;background:transparent;
  font:inherit;font-size:15px;color:var(--ink);
  outline:none;padding:6px 0;
}
.chat-input::placeholder{color:var(--soft)}
.send-btn{
  width:42px;height:42px;border-radius:50%;
  background:var(--clover);border:none;
  color:#fff;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .15s,transform .1s;
}
.send-btn:hover{opacity:.88}
.send-btn:active{transform:scale(.93)}

/* chips */
.chips{
  display:flex;flex-wrap:wrap;gap:6px;
  justify-content:center;
  margin-top:14px;
}
.chip{
  font-family:var(--mono);font-size:11px;
  padding:5px 12px;border-radius:20px;
  background:var(--raised);border:1px solid var(--rule);
  color:var(--soft);cursor:pointer;
  box-shadow:var(--shadow);
  transition:border-color .15s,color .15s;
}
.chip:hover{border-color:var(--clover);color:var(--clover)}

/* projects */
.projects{
  display:flex;gap:14px;
  justify-content:center;
  flex-wrap:nowrap;
  margin-top:36px;
  padding-bottom:40px;
  width:100%;
  max-width:810px;
  transition:margin .3s ease;
}
.center.has-chat .projects{margin-top:24px}
.proj{
  display:flex;flex-direction:column;align-items:flex-start;
  position:relative;
  width:190px;
}
.proj-card{
  position:relative;z-index:1;pointer-events:none;
  width:190px;height:127px;border-radius:12px;
  border:1px solid var(--rule);
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:transform .18s,box-shadow .18s;
  background:var(--raised);
}
.proj:hover .proj-card{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.proj-thumb{position:absolute;inset:0}
.proj-thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
/* 밝은 스크린샷 위에서도 읽히도록 반투명 어두운 알약 */
.proj-badge{
  position:absolute;top:8px;left:8px;
  padding:3px 8px;border-radius:999px;
  font-size:10.5px;font-weight:600;color:#fff;
  background:rgba(18,22,29,.62);
  white-space:nowrap;
}
.proj-name{
  margin-top:10px;
  font-size:14px;font-weight:600;color:var(--ink);
  text-decoration:none;
}
.proj-desc{
  margin-top:2px;font-size:12px;color:var(--soft);
  line-height:1.4;word-break:keep-all;
}
/* 이름 링크가 카드 전체를 덮고, 문서 아이콘만 그 위로 올라온다 (a 안에 a를 못 넣어서) */
.proj-name::after{content:"";position:absolute;inset:0}
.proj-docs{
  pointer-events:auto;
  position:absolute;top:6px;right:6px;
  width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--clover);background:rgba(255,255,255,.92);
  box-shadow:0 1px 3px rgba(0,0,0,.15);
}
.proj-docs:hover{background:#fff}

/* per-project colors */
.thumb-arda  { background:linear-gradient(135deg,#4F6BED 0%,#7B8FFF 100%) }
.thumb-fridge{ background:linear-gradient(135deg,#226647 0%,#4CAF7D 100%) }
.thumb-yaksok{ background:linear-gradient(135deg,#2B9E8E 0%,#5EC9B8 100%) }
.thumb-yang  { background:#f0f2f5 }
/* 가로로 긴 화면이라 잘리지 않게 통째로 넣고, 남는 위아래는 스크린샷 바탕색으로 채운다 */
.thumb-yang img{object-fit:contain;object-position:center}

@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}}
@media(max-width:600px){
  .center{padding:0 16px}
  .logo-text{font-size:1.5rem}
  .projects{gap:8px;overflow-x:auto;justify-content:flex-start;padding-bottom:48px}
  .proj{width:150px;flex:none}
  .proj-card{width:150px;height:100px}
  /* 좁은 카드에선 배지가 문서 아이콘에 가리지 않게 단어 단위로 줄바꿈 */
  .proj-badge{white-space:normal;word-break:keep-all;max-width:calc(100% - 44px);line-height:1.3;border-radius:8px}
}

/* intro: 클로버 들판에서 네잎을 누르면 잎 4장(프로젝트)이 열리고, 스크롤하면 아래 카드 자리로 내려앉는다.
   들판은 다크 모드에서도 같은 장면이라 색을 고정한다 */
.intro{position:fixed;inset:0;z-index:100;overflow:hidden;touch-action:none;transition:opacity .4s}
.intro::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,#fff 0%,#E3EFE8 75%);opacity:var(--bg,1)}
.intro.out{opacity:0;pointer-events:none}
.intro-field{position:absolute;inset:0;width:100%;height:100%}
.intro-brand{
  position:absolute;left:50%;top:12vh;transform:translateX(-50%);z-index:2;pointer-events:none;
  display:flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(6px);
  font:600 clamp(20px,4vw,30px) var(--mono);letter-spacing:-.02em;color:#12161D;white-space:nowrap;
}
.intro-brand svg{width:28px;height:28px;color:#226647}
.intro-tld{color:#226647}
/* 수상 사진을 네잎클로버 모양으로 오려 둔다 (SVG clipPath로 하트 잎 4장) */
.intro-photo{position:absolute;left:5vw;top:26vh;z-index:2;margin:0;width:clamp(170px,16vw,240px);cursor:zoom-in;transform-origin:50% 100%;animation:intro-sway 4s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(18,22,29,.18))}
.intro-photo svg{display:block;width:100%;overflow:visible}
.intro-photo figcaption{width:max-content;margin:8px auto 0;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.85);font:500 11.5px/1.5 var(--mono);color:#3F4A5C;text-align:center}
.intro-photo:hover svg{transform:scale(1.04)}
.intro-photo svg{transition:transform .2s}
.intro-lightbox{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(12,24,17,.72);cursor:zoom-out}
.intro-lightbox[hidden]{display:none}
.intro-lightbox img{max-width:100%;max-height:88vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
@keyframes intro-sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(-1deg)}}
@media(max-width:700px){.intro-photo{display:none}}
.intro-stem{position:absolute;z-index:1;width:1px;height:1px;overflow:visible}
.intro:not(.found) .intro-leaf{display:none}
.intro-leaf{position:absolute;z-index:2;overflow:hidden;border:3px solid #226647;background:#fff;box-shadow:0 10px 30px rgba(18,22,29,.15)}
.intro-leaf img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.intro-leaf::after{content:"";position:absolute;inset:0;background:#226647;opacity:var(--g,1)}
.intro-click{
  position:absolute;z-index:3;transform:translate(-50%,-100%);
  font:700 14px var(--mono);letter-spacing:.04em;color:#fff;background:#226647;
  border:0;border-radius:999px;padding:8px 16px;cursor:pointer;
  box-shadow:0 6px 18px rgba(34,102,71,.35);animation:intro-hop 1s ease-in-out infinite;
}
.intro-click::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#226647}
.intro:not(.found) .intro-cap{display:none}
.intro-cap{position:absolute;left:0;right:0;bottom:28px;z-index:4;width:max-content;max-width:calc(100% - 32px);margin:0 auto;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(18,22,29,.12);text-align:center;font:500 14px var(--mono);color:#12161D;pointer-events:none;animation:intro-bob 1.6s ease-in-out infinite}
.intro-skip{position:absolute;right:16px;top:16px;z-index:3;font:500 12px var(--mono);background:none;border:0;color:#5A6478;cursor:pointer;text-decoration:underline}
@keyframes intro-hop{50%{transform:translate(-50%,calc(-100% - 8px))}}
@keyframes intro-bob{50%{transform:translateY(6px)}}
</style>
</head>

function renderMd(t){
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>')
    .replace(/&lt;(a [^&]+)&gt;(.+?)&lt;\/a&gt;/g,'<$1>$2</a>');
}

function addMsg(text,role){
  const el=document.createElement('div');
  el.className=`msg ${role}`;
  const av=document.createElement('div');
  av.className='msg-avatar';
  av.textContent=role==='bot'?'C':'me';
  const bub=document.createElement('div');
  bub.className='msg-bubble';
  if(role==='bot') bub.innerHTML=renderMd(text);
  else bub.textContent=text;
  el.appendChild(av);el.appendChild(bub);
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'end'});
  return el;
}

function showTyping(){
  const el=document.createElement('div');
  el.className='msg bot typing';
  el.innerHTML='<div class="msg-avatar">C</div><div class="msg-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  document.getElementById('messages').appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'end'});
  return el;
}

function getAnswer(q){
  // 띄어쓰기 없이 물어도("무슨일할수있어") 걸리도록 공백을 지우고 비교
  const l=q.toLowerCase().replace(/\s/g,'');
  for(const item of FAQ){
    if(!item.keys.some(k=>l.includes(k.replace(/\s/g,'')))) continue;
    if(!Array.isArray(item.answer)) return item.answer;
    item.turn=((item.turn??-1)+1)%item.answer.length;
    return item.answer[item.turn];
  }
  return '음… 그건 아직 대답하기 어려워요.\n**소개 · 할 수 있는 일 · 학력 · 프로젝트 · 기술 스택 · 경력 · 강점 · 연락처** 중에서 물어봐 주세요!\n더 궁금한 건 📧 <a href="mailto:Soyeon040403@gmail.com">Soyeon040403@gmail.com</a>으로 보내 주세요.';
}

let logoMoved=false;
function animateLogo(){
  if(logoMoved) return;
  logoMoved=true;
  const logo=document.getElementById('logo');
  const r=logo.getBoundingClientRect();
  // snap to fixed at current position (no transition yet)
  logo.style.cssText=`position:fixed;top:${r.top}px;left:${r.left}px;width:${r.width}px;margin:0;z-index:50;transform-origin:top left;cursor:pointer`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    logo.style.transition='top .45s cubic-bezier(.4,0,.2,1),left .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1)';
    logo.style.top='16px';
    logo.style.left='20px';
    logo.style.transform='scale(0.45)';
  }));
}

function send(q){
  if(!q.trim()) return;
  document.getElementById('input').value='';
  animateLogo();
  document.getElementById('center').classList.add('has-chat');
  addMsg(q,'user');
  const t=showTyping();
  setTimeout(()=>{t.remove();addMsg(getAnswer(q),'bot');},500+Math.random()*300);
}

document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();send(document.getElementById('input').value);});
document.getElementById('logo').addEventListener('click',()=>{

  logo.style.transition='opacity .25s';

  setTimeout(()=>{
    logo.style.cssText='';
    document.getElementById('center').classList.remove('has-chat');

});

<script>
(()=>{
const intro=document.getElementById('intro');
if(matchMedia('(prefers-reduced-motion: reduce)').matches){intro.remove();return}
const cv=intro.querySelector('.intro-field'),ctx=cv.getContext('2d');
const photo=intro.querySelector('.intro-photo'),brand=intro.querySelector('.intro-brand'),cap=intro.querySelector('.intro-cap'),cm=intro.querySelector('.intro-click'),skip=intro.querySelector('.intro-skip');
const stem=intro.querySelector('.intro-stem'),path=stem.querySelector('path');
const cards=[...document.querySelectorAll('.proj-card')];
const leaves=cards.map(c=>{const d=document.createElement('div');d.className='intro-leaf';d.innerHTML=`<img src="${c.querySelector('img').src}" alt="">`;intro.appendChild(d);return d});
const clamp=x=>Math.min(1,Math.max(0,x)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

// 들판: 매번 같은 배치가 나오게 고정 시드
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const items=[];
for(let i=0;i<260;i++)items.push({x:rnd(),y:lerp(.22,1.08,rnd()),rot:rnd()*6.28,ph:rnd()*6.28,l:lerp(24,46,rnd())});
items.sort((a,b)=>a.y-b.y);
const lucky={x:.63,y:.7,rot:.4,ph:1,l:62};
const size=(it,W)=>it.l*lerp(.35,1.2,it.y)*Math.min(1,W/900+.3);
const swayOf=(it,s,t)=>Math.sin(t/1100+it.ph+it.x*3)*s*.18;
// 토끼풀 잎: 끝이 오목한 하트 모양
function leaflet(s){
  ctx.beginPath();ctx.moveTo(0,0);
  ctx.bezierCurveTo(s*.12,-s*.32,s*.5,-s*.62,s*.82,-s*.4);
  ctx.bezierCurveTo(s*1.02,-s*.24,s*.98,-s*.04,s*.8,0);
  ctx.bezierCurveTo(s*.98,s*.04,s*1.02,s*.24,s*.82,s*.4);
  ctx.bezierCurveTo(s*.5,s*.62,s*.12,s*.32,0,0);
}
function clover(x,y,s,rot,n,hue,light,sat){
  ctx.save();ctx.translate(x,y);
  ctx.strokeStyle=`hsl(${hue+8},32%,${light-4}%)`;ctx.lineWidth=Math.max(1,s*.07);
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(s*.15,s*.9,s*.05,s*1.8);ctx.stroke();
  ctx.rotate(rot);
  for(let i=0;i<n;i++){
    ctx.save();ctx.rotate(i*Math.PI*2/n+(i%2?.06:-.04));
    leaflet(s);ctx.fillStyle=`hsl(${hue},${sat}%,${light+(i%2)*3}%)`;ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function star(x,y,r){ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.3:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.fill()}

// 잎 배치: 왼위, 오위, 왼아래, 오아래 — 뾰족한 모서리가 가운데를 향하게 [tl,tr,br,bl]
const q=[[-1,-1],[1,-1],[-1,1],[1,1]];
const R=[[.5,.5,0,.5],[.5,.5,.5,0],[.5,0,.5,.5],[0,.5,.5,.5]];

let found=0,hint=false,lp=null,lastT=0,target=0,p=0,parked=false;
const luckyAt=t=>{const W=innerWidth,H=innerHeight,s=size(lucky,W);return{x:lucky.x*W+swayOf(lucky,s,t),y:lucky.y*H,s}};
const near=(e,L)=>Math.hypot(e.clientX-L.x,e.clientY-L.y)<L.s*1.4;
function find(){
  if(found)return;
  found=lastT;lp=luckyAt(lastT);intro.classList.add('found');photo.style.pointerEvents='none';cm.remove();cv.style.cursor='';
}
// 다 내려앉으면 인트로를 지우지 않고 숨겨 둔다 — 페이지 맨 위에서 위로 스크롤하면 다시 클로버로 돌아감
function park(){parked=true;p=target=1;intro.classList.add('out')}
function unpark(){if(!parked)return;parked=false;intro.classList.remove('out');requestAnimationFrame(render)}
function skipIntro(){
  if(!found){find();found=lastT-1400}
  park();
}
// 네잎을 찾기 전엔 스크롤하려 하면 힌트만 세게, 찾은 뒤엔 스크롤이 잎을 카드 자리로 보낸다
const push=d=>{if(!found){hint=true;return}target=clamp(target+d)};
intro.addEventListener('wheel',e=>{e.preventDefault();push(e.deltaY/900)},{passive:false});
let ty=null;
intro.addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
intro.addEventListener('touchmove',e=>{e.preventDefault();const y=e.touches[0].clientY;push((ty-y)/500);ty=y},{passive:false});
addEventListener('keydown',e=>{
  const up=e.key==='ArrowUp'||e.key==='PageUp';
  if(parked){if(up&&!e.target.closest('input')){unpark();push(-.25)}return}
  if(e.key==='ArrowDown'||e.key==='PageDown')push(.25);if(up)push(-.25);
});
// 숨겨진 뒤: 챗봇 대화창을 위로 다 올린 상태에서만 인트로를 다시 부른다
const atTop=e=>{const m=e.target.closest&&e.target.closest('#messages');return!m||m.scrollTop<=0};
addEventListener('wheel',e=>{if(parked&&e.deltaY<0&&atTop(e)){unpark();push(e.deltaY/900)}},{passive:true});
let wy=null;
addEventListener('touchstart',e=>{wy=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{if(parked&&wy!==null&&e.touches[0].clientY-wy>40&&atTop(e)){unpark();target=.7}},{passive:true});
cv.addEventListener('mousemove',e=>{if(!found)cv.style.cursor=near(e,luckyAt(lastT))?'pointer':''});
cv.addEventListener('click',e=>{if(near(e,luckyAt(lastT)))find()});
cm.addEventListener('click',find);
skip.addEventListener('click',skipIntro);
// 수상 사진 네잎을 누르면 크게, 아무 데나 누르거나 Esc로 닫기
const lb=intro.querySelector('.intro-lightbox');
photo.addEventListener('click',()=>{lb.hidden=false});
photo.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();lb.hidden=false}});
lb.addEventListener('click',()=>{lb.hidden=true});
addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true});

function render(t){
  if(parked)return;
  requestAnimationFrame(render);
  lastT=t;p+=(target-p)*.12;
  if(target===1&&p>.97){park();return}
  const dpr=devicePixelRatio||1,W=innerWidth,H=innerHeight;
  if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr}
  if(t>3500)hint=true;
  const f=found?ease(clamp((t-found)/1400)):0;

  if(f<1){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#F4F9F5');g.addColorStop(.3,'#DCEFE2');g.addColorStop(1,'#9CCDAE');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    const tx=lucky.x*W,ty=lucky.y*H;
    for(const it of items){
      const s=size(it,W);let x=it.x*W+swayOf(it,s,t),y=it.y*H;
      // 찾으면 세잎들이 네잎 기준으로 밀려남
      if(f){const dx=x-tx,dy=y-ty,d=Math.hypot(dx,dy)||1;x+=dx/d*f*W*.7;y+=dy/d*f*W*.7}
      clover(x,y,s,it.rot,3,132+it.ph*1.5,lerp(62,32,it.y),45);
    }
    if(!found){
      const L=luckyAt(t),pulse=hint?1+.12*(Math.sin(t/220)+1)/2:1;
      cm.style.left=L.x+'px';cm.style.top=(L.y-L.s*1.15)+'px';
      // 네잎 뒤에 은은한 햇빛 — 잎 자체는 다른 클로버와 같은 질감으로 둔다
      const hr=L.s*(hint?2.4:1.9)*(1+.08*Math.sin(t/300)),hg=ctx.createRadialGradient(L.x,L.y,0,L.x,L.y,hr);
      hg.addColorStop(0,'rgba(255,244,180,.75)');hg.addColorStop(1,'rgba(255,244,180,0)');
      ctx.fillStyle=hg;ctx.beginPath();ctx.arc(L.x,L.y,hr,0,7);ctx.fill();
      clover(L.x,L.y,L.s*pulse,lucky.rot,4,130,42,58);
      ctx.fillStyle='rgba(255,236,150,.95)';
      const n=hint?6:4;
      for(let i=0;i<n;i++){const a=t/1500+i*6.28/n,tw=(Math.sin(t/250+i*2)+1)/2;star(L.x+Math.cos(a)*L.s*1.1,L.y-L.s*.4+Math.sin(a)*L.s*.8,3+tw*(hint?9:6))}
    }
  }
  cv.style.opacity=1-f;
  brand.style.opacity=photo.style.opacity=1-f;
  if(!found)return;

  cap.style.opacity=skip.style.opacity=1-clamp(p*8);
  intro.style.setProperty('--bg',1-clamp((p-.4)/.5));
  const Sf=Math.min(W*.42,H*.37),C={x:lerp(lp.x,W/2,f),y:lerp(lp.y,H*.5,f)},S=lerp(lp.s*.55,Sf,f);
  const sway=Math.sin(t/900)*3*f,spin=(1-f)*360,reveal=clamp((t-found-900)/700);
  leaves.forEach((d,k)=>{
    const e=ease(clamp((p-k*.08)/.6)),ang=(sway+spin)*(1-e);
    const a=ang*Math.PI/180,ox=q[k][0]*(S/2+3*f),oy=q[k][1]*(S/2+3*f);
    const x0=C.x+ox*Math.cos(a)-oy*Math.sin(a),y0=C.y+ox*Math.sin(a)+oy*Math.cos(a);
    // 실제 카드 자리로 내려앉음
    const r=cards[k].getBoundingClientRect(),x1=r.left+r.width/2,y1=r.top+r.height/2;
    const x=lerp(x0,x1,e),y=lerp(y0,y1,e)-Math.sin(e*Math.PI)*H*.15;
    const w=lerp(S,r.width,e),h=lerp(S,r.height,e);
    d.style.cssText=`left:${x-w/2}px;top:${y-h/2}px;width:${w}px;height:${h}px;--g:${(1-reveal)*(1-e)};border-width:${lerp(1,3,f)*(1-e)+e}px;`+
      `border-radius:${R[k].map(v=>lerp(v*S,12,e)+'px').join(' ')};transform:rotate(${ang+Math.sin(e*Math.PI)*25*(k%2?1:-1)}deg)`;
  });
  stem.style.cssText=`left:${C.x}px;top:${C.y}px;opacity:${f*(1-clamp(p*5))}`;
  path.setAttribute('d',`M0 0 C ${10+sway} ${S*.9}, ${40+sway*2} ${S*1.3}, ${70+sway*3} ${S*1.7}`);
}
requestAnimationFrame(render);
})();
</script>
